databases:
  # Durable home for the disable_strategy kill-switch registry. Required
  # because the mcp-server web service below runs on the free plan, whose
  # filesystem is wiped on every restart, redeploy, or spin-down — a local
  # strategy_state.json file would silently lose "disabled" entries.
  #
  # Free-plan caveat: Render deletes a free Postgres database 30 days after
  # creation. This still fixes the reported bug (state no longer vanishes on
  # every restart/redeploy/spin-down) but needs the database recreated and
  # DATABASE_URL updated before day 30, or an upgrade to a paid plan, to stay
  # durable long-term.
  - name: sentinel-strategy-state
    plan: free
    databaseName: sentinel_strategy_state
    user: sentinel

services:
  - type: web
    name: sentinel-alpaca-mcp
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace mcp-server
    startCommand: npm start --workspace mcp-server
    healthCheckPath: /health
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: MCP_SHARED_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-strategy-state
          property: connectionString

  - type: web
    name: sentinel-ui
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build --workspace ui
    staticPublishPath: ui/dist
    envVars:
      - key: VITE_TRUEFORGE_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
